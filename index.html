<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARGOS · FIDAL Notaires</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
:root{
  --nuit:#0F2238; --canard:#33838B; --carmin:#A01040; --cyan:#6DD5DC; --orange:#FF982D;
  --fond:#F5F6F8; --blanc:#FFFFFF; --trait:#DDE1E7; --texte:#1B2430; --doux:#5E6875;
  --tete:56px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte)}
body{overflow:hidden}
button{font:inherit;cursor:pointer}
.tete{height:var(--tete);background:var(--nuit);color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px;padding-top:env(safe-area-inset-top,0px)}
.marque{display:flex;align-items:baseline;gap:10px}
.marque b{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:22px;letter-spacing:.12em}
.marque span{font-size:12px;color:var(--cyan)}
.client{font-size:14px;opacity:.9;border-left:1px solid rgba(255,255,255,.25);padding-left:16px}
.chiffres{display:flex;gap:8px}
.chiffre{background:rgba(255,255,255,.08);border-radius:6px;padding:4px 10px;font-size:12px;color:#C9D3DE}
.chiffre strong{color:#fff;font-weight:600;font-size:13px}
.demo{font-size:11px;color:var(--nuit);background:var(--cyan);border-radius:4px;padding:2px 8px}
.espace{flex:1}
.btn-tete{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-tete:hover{background:rgba(255,255,255,.1)}
.btn-tete svg{width:16px;height:16px}
.corps{display:grid;grid-template-columns:240px 300px minmax(0,1fr) 320px;height:calc(100% - var(--tete) - env(safe-area-inset-top,0px))}
.liste{background:var(--blanc);border-right:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
.outils{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--trait)}
.outils input,.outils select{height:34px;border:1px solid var(--trait);border-radius:6px;padding:0 10px;font:inherit;font-size:13px;background:#fff;color:var(--texte)}
.outils input:focus,.outils select:focus{outline:2px solid var(--canard);outline-offset:-1px}
.vues{display:flex;border:1px solid var(--trait);border-radius:6px;overflow:hidden}
.vues button{flex:1;height:30px;border:0;background:#fff;font-size:13px;color:var(--doux)}
.vues button[aria-pressed="true"]{background:var(--nuit);color:#fff}
.defile{overflow-y:auto;flex:1;padding:6px 0 16px}
.resume{border-top:1px solid var(--trait);padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;background:var(--fond)}
.resume div{font-size:12px;color:var(--doux)}
.resume strong{display:block;font-family:Georgia,serif;font-weight:400;font-size:20px;color:var(--nuit)}
.resume .large{grid-column:1 / -1}
.pli{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;text-align:left;color:var(--nuit)}
.pli:hover{background:var(--fond)}
.pli:focus-visible{outline:2px solid var(--canard);outline-offset:-2px}
.pli .chev{width:16px;height:16px;flex:none;color:var(--canard);transition:transform .18s ease}
.pli[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pli small{margin-left:auto;font-size:11px;color:var(--doux)}
.pli.reg{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--canard);padding:10px 14px;border-top:1px solid #EEF0F3}
.pli.com{font-family:Georgia,serif;font-size:15px;padding:7px 14px 7px 26px}
.pli.com small{font-family:"Segoe UI",sans-serif}
.rue{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 14px 6px 50px;font-size:13px;color:var(--texte)}
.rue:hover{background:var(--fond)}
.rue.actif{border-left-color:var(--carmin);background:#FBEFF3;color:var(--carmin);font-weight:600}
.rue:focus-visible{outline:2px solid var(--canard);outline-offset:-2px}
.vide{padding:20px 14px;font-size:13px;color:var(--doux)}
.carte-zone{position:relative;min-height:0}
#carte{position:absolute;inset:0;background:#E8ECEF}
.btn-carte{position:absolute;z-index:500;background:#fff;border:1px solid var(--trait);border-radius:6px;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--nuit);box-shadow:0 1px 3px rgba(15,34,56,.15)}
.btn-carte:hover{background:var(--fond)}
.btn-carte svg{width:16px;height:16px}
#btnPlein{top:12px;right:12px}
.incrustations{background:var(--blanc);border-left:1px solid var(--trait);padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.ins{position:relative;flex:1;min-height:180px;border:1px solid var(--trait);border-radius:8px;overflow:hidden}
.ins .vue{position:absolute;inset:0;background:#E8ECEF}
.ins .nom{position:absolute;left:8px;bottom:8px;z-index:500;background:rgba(15,34,56,.82);color:#fff;font-size:12px;border-radius:4px;padding:2px 8px}
.bascule{position:absolute;left:6px;top:6px;z-index:500;display:flex;background:#fff;border:1px solid var(--trait);border-radius:6px;overflow:hidden}
.bascule button{border:0;background:#fff;font-size:12px;padding:5px 9px;color:var(--doux)}
.bascule button[aria-pressed="true"]{background:var(--nuit);color:#fff}
.fond-gris{filter:grayscale(1) contrast(.85) brightness(1.12);opacity:.5}
.leaflet-tooltip.etiq-zone{background:rgba(255,255,255,.88);border:0;box-shadow:none;color:#1B2430;font-weight:700;font-size:12px;padding:1px 5px;border-radius:3px}
.leaflet-tooltip.etiq-zone::before{display:none}
.legende{position:absolute;right:6px;bottom:8px;z-index:500;background:rgba(255,255,255,.92);border-radius:4px;padding:3px 6px;font-size:11px;display:flex;gap:7px}
.legende i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.cadenas{position:absolute;right:6px;top:6px;z-index:500;width:30px;height:30px;border-radius:6px;border:1px solid var(--trait);background:#fff;display:grid;place-items:center;color:var(--canard)}
.cadenas svg{width:16px;height:16px}
.cadenas.ferme{color:var(--carmin);border-color:var(--carmin)}
.aide-ins{font-size:11px;color:var(--doux);line-height:1.4}
.fiche{background:var(--blanc);border-right:1px solid var(--trait);overflow-y:auto;padding:18px 18px 14px;display:flex;flex-direction:column}
.bloc .titre-bloc{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:2px 0;font-size:12px;font-weight:600;color:var(--canard);text-align:left}
.bloc .titre-bloc .chev{width:14px;height:14px;transition:transform .2s ease}
.bloc .titre-bloc[aria-expanded="true"] .chev{transform:rotate(90deg)}
.bloc .titre-bloc:focus-visible{outline:2px solid var(--canard);outline-offset:2px}
.contenu-bloc{margin-top:6px}
.theme{margin-top:10px}
.theme h4{margin:0 0 2px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--doux)}
.sans-doc{font-size:12px;color:var(--doux);font-style:italic;padding:4px 0 6px;border-bottom:1px solid #EEF0F3}
.genere{font-size:10px;color:var(--canard);border:1px solid var(--canard);border-radius:3px;padding:0 4px;margin-left:6px}
.assist{margin-top:auto;padding-top:20px}
.assist>button{width:100%;height:36px;border:1px solid var(--trait);border-radius:6px;background:#fff;color:var(--nuit);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.assist>button:hover{background:var(--fond)}
.assist .chev{width:14px;height:14px;transition:transform .2s}
.assist>button[aria-expanded="true"] .chev{transform:rotate(90deg)}
.onglets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .35s ease}
.onglets.ouvert{max-height:80px;opacity:1}
.onglets button{flex:1 1 auto;border:1px solid var(--canard);background:#fff;color:var(--canard);border-radius:16px;padding:4px 10px;font-size:12px}
.onglets button[aria-pressed="true"]{background:var(--canard);color:#fff}
.carte-contact{margin-top:10px;font-size:13px;border-left:2px solid var(--canard);padding:4px 0 4px 10px;line-height:1.45}
.carte-contact strong{display:block;color:var(--nuit)}
.carte-contact a{color:var(--canard)}
.code-site{font-size:11px;color:var(--doux)}
.pied{margin-top:auto;padding-top:24px;font-size:12px;text-align:right}
.pied a{color:var(--doux);text-decoration:none;border-bottom:1px dotted var(--doux)}
.pied a:hover{color:var(--canard);border-bottom-color:var(--canard)}
.fiche h2{font-family:Georgia,serif;font-weight:400;font-size:22px;margin:0;color:var(--nuit)}
.fiche .adr{margin:4px 0 0;font-size:14px;color:var(--doux)}
.nav-site{display:flex;gap:8px;margin:14px 0 16px}
.nav-site button{flex:1;height:32px;border:1px solid var(--trait);border-radius:6px;background:#fff;font-size:13px;color:var(--nuit)}
.nav-site button:hover{background:var(--fond)}
.bloc{border-top:1px solid var(--trait);padding-top:12px;margin-top:12px}
.bloc h3{font-size:12px;font-weight:600;color:var(--canard);margin:0 0 8px}
.ligne{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.ligne span:first-child{color:var(--doux)}
.doc{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid #EEF0F3;padding:8px 0;font-size:13px;color:var(--texte);text-align:left}
.doc:hover{color:var(--carmin)}
.doc svg{width:18px;height:18px;flex:none;color:var(--doux)}
.doc .dl{margin-left:auto;color:var(--canard)}
.interloc{font-size:13px;padding:6px 0;line-height:1.45}
.interloc strong{display:block;font-weight:600;color:var(--nuit)}
.interloc a{color:var(--canard)}
.leaflet-tooltip.adresse{background:var(--nuit);color:#fff;border:0;border-radius:4px;font-size:12px;padding:4px 8px;box-shadow:none}
.leaflet-tooltip.adresse::before{border-top-color:var(--nuit)}
.leaflet-container{font-family:inherit}
/* Mode visite */
.visite-ctl{display:none}
body.visite .liste,body.visite .incrustations,body.visite .fiche,body.visite #btnPlein{display:none}
body.visite .corps{grid-template-columns:1fr}
body.visite .visite-ctl{display:block}
.choix-commune{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;align-items:center;gap:10px;background:var(--nuit);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px}
.choix-commune select{height:30px;border-radius:5px;border:0;padding:0 8px;font:inherit;font-size:13px}
.choix-commune button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;height:30px;padding:0 10px;font-size:13px}
.fleche{position:absolute;top:50%;transform:translateY(-50%);z-index:600;width:56px;height:56px;border-radius:50%;border:0;background:rgba(15,34,56,.85);color:#fff;display:grid;place-items:center}
.fleche:hover{background:var(--nuit)}
.fleche svg{width:26px;height:26px}
.fleche.g{left:20px}.fleche.d{right:20px}
.bandeau-visite{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:600;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(15,34,56,.2);padding:12px 18px;display:flex;align-items:center;gap:18px;max-width:calc(100% - 140px)}
.bandeau-visite .rang{font-size:12px;color:var(--doux);white-space:nowrap}
.bandeau-visite h2{font-family:Georgia,serif;font-weight:400;font-size:20px;margin:0;color:var(--nuit)}
.bandeau-visite p{margin:2px 0 0;font-size:13px;color:var(--doux)}
.bandeau-visite .liens{display:flex;gap:12px;font-size:13px;color:var(--canard);white-space:nowrap}
/* Fenêtre contact et message */
.voile{position:fixed;inset:0;background:rgba(15,34,56,.45);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.voile.ouvert{display:flex}
.fenetre{background:#fff;border-radius:10px;max-width:440px;width:100%;padding:22px 24px}
.fenetre h2{font-family:Georgia,serif;font-weight:400;margin:0 0 12px;color:var(--nuit)}
.fenetre .fermer{margin-top:16px;height:34px;border:1px solid var(--trait);background:#fff;border-radius:6px;padding:0 14px}
#message{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--nuit);color:#fff;border-radius:8px;padding:10px 16px;font-size:13px;z-index:3000;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90%}
#message.vu{opacity:1;transform:translateX(-50%) translateY(0)}
/* Animation d'ouverture */
#intro{position:fixed;inset:0;z-index:5000;background:var(--nuit);overflow:hidden;transition:opacity .9s ease}
#intro.part{opacity:0}
#introCarte{position:absolute;inset:0}
#intro .voile-intro{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(15,34,56,0) 40%,rgba(15,34,56,.75) 100%),linear-gradient(to top,rgba(15,34,56,.85),rgba(15,34,56,0) 45%)}
.intro-boite{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none}
#intro.titre .intro-boite{opacity:1}
.nom-intro{font-family:Georgia,serif;color:#fff;font-size:68px;letter-spacing:.6em;padding-left:.6em;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#intro.titre .nom-intro{animation:serre 1.1s ease-out forwards}
@keyframes serre{from{letter-spacing:.6em;opacity:0}to{letter-spacing:.16em;opacity:1}}
.trait-intro{height:2px;background:var(--cyan);width:0;margin-top:14px}
#intro.titre .trait-intro{animation:trait .7s .7s ease-out forwards}
@keyframes trait{to{width:260px}}
.sous-intro{margin-top:10px;color:var(--cyan);font-size:15px;letter-spacing:.08em;opacity:0}
#intro.titre .sous-intro{animation:apparait .6s 1s ease-out forwards}
@keyframes apparait{to{opacity:1}}
.passer{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(15,34,56,.55);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:7px 14px;font-size:13px}
.passer:hover{background:rgba(15,34,56,.85)}
.alerte{position:relative;width:34px;height:34px;opacity:0;transform:scale(.4);transition:opacity .4s ease,transform .5s cubic-bezier(.2,1.5,.4,1)}
.alerte.pose{opacity:1;transform:none}
.alerte svg{position:absolute;inset:0;width:34px;height:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.alerte::before{content:"";position:absolute;left:50%;top:60%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #FF982D;animation:onde 1.6s ease-out infinite}
.balise{position:relative;width:2px;height:170px;opacity:0}
.balise.pose{opacity:1}
.balise .faisceau{position:absolute;left:0;bottom:0;width:2px;height:100%;transform-origin:50% 100%;transform:scaleY(0);background:linear-gradient(to top,rgba(160,16,64,1),rgba(160,16,64,.55) 55%,rgba(109,213,220,.9));box-shadow:0 0 10px rgba(160,16,64,.9),0 0 22px rgba(160,16,64,.5)}
.balise.pose .faisceau{animation:monte 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes monte{to{transform:scaleY(1)}}
.balise .pied-b{position:absolute;left:-6px;bottom:-6px;width:14px;height:14px;border-radius:50%;background:#A01040;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 18px 4px rgba(160,16,64,.8)}
.balise.pose .pied-b::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(160,16,64,.8);animation:onde 2s ease-out .4s infinite}
@keyframes onde{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
.balise .carte-b{position:absolute;left:12px;top:-6px;min-width:190px;padding:9px 14px 10px;background:rgba(15,34,56,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-left:2px solid #A01040;border-radius:2px 6px 6px 2px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateX(-8px)}
.balise.pose .carte-b{animation:glisse .6s .9s ease-out forwards}
@keyframes glisse{to{opacity:1;transform:none}}
.balise .carte-b b{display:block;font-family:Georgia,serif;font-weight:400;font-size:17px;color:#fff;letter-spacing:.02em}
.balise .carte-b span{display:block;margin-top:2px;font-size:12px;color:#B9C6D3}
.balise .carte-b i{display:block;width:28px;height:2px;background:var(--cyan);margin-top:7px}
@media (prefers-reduced-motion: reduce){#intro{display:none}}
@media (max-width:1100px){
  body{overflow:auto}
  .corps{display:flex;flex-direction:column;height:auto}
  .liste{max-height:280px}
  .carte-zone{height:60vh}
  .incrustations{flex-direction:row;border-right:0;border-bottom:1px solid var(--trait)}
  .aide-ins{display:none}
  .chiffres,.client{display:none}
  body.visite{overflow:hidden}
  body.visite .carte-zone{height:calc(100vh - var(--tete))}
}
@media (max-width:600px){
  .btn-tete .txt{display:none}
  .bandeau-visite{flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 24px)}
  .fleche{top:auto;bottom:150px}
}
</style>
</head>
<body>

<div id="intro" role="presentation" aria-hidden="true">
  <div id="introCarte"></div>
  <div class="voile-intro"></div>
  <div class="intro-boite">
    <div class="nom-intro">ARGOS</div>
    <div class="trait-intro"></div>
    <div class="sous-intro">FIDAL Notaires</div>
  </div>
  <button type="button" class="passer" id="passerIntro">Passer</button>
</div>

<header class="tete">
  <div class="marque"><b>ARGOS</b><span>FIDAL Notaires</span></div>
  <div class="client">Client de démonstration</div>
  <span class="demo">Maquette · données fictives</span>
  <div class="espace"></div>
  <button class="btn-tete" id="btnVisite" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8"/></svg>
    <span class="txt">Mode visite</span>
  </button>

</header>

<main class="corps">
  <aside class="liste" aria-label="Liste des sites">
    <div class="outils">
      <input id="recherche" type="search" placeholder="Commune ou rue" aria-label="Rechercher une commune ou une rue">
      <select id="region" aria-label="Filtrer par région"></select>
      <div class="vues" role="group" aria-label="Classement de la liste">
        <button type="button" data-vue="region" aria-pressed="true">Par région</button>
        <button type="button" data-vue="commune" aria-pressed="false">Par commune</button>
      </div>
    </div>
    <div class="defile" id="liste"></div>
    <div class="resume" id="resume"></div>
  </aside>

  <aside class="fiche" id="fiche" aria-label="Fiche du site"></aside>

  <section class="carte-zone" id="zoneCarte" aria-label="Carte des sites">
    <div id="carte"></div>
    <button class="btn-carte" id="btnPlein" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span id="txtPlein">Plein écran</span>
    </button>
    <div class="visite-ctl">
      <div class="choix-commune">
        <label for="visiteCommune">Commune</label>
        <select id="visiteCommune"></select>
        <button type="button" id="quitterVisite">Quitter la visite</button>
      </div>
      <button class="fleche g" id="visitePrec" type="button" aria-label="Site précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="fleche d" id="visiteSuiv" type="button" aria-label="Site suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="bandeau-visite" id="bandeauVisite"></div>
    </div>
  </section>

  <div class="incrustations" aria-label="Vues complémentaires">
    <div class="ins">
      <div class="vue" id="vueAerienne"></div>
      <span class="nom">Vue aérienne</span>

function sansAccent(t) { return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

    '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>' + libelle + '</button>';
}
function montrerContact(s, cle) {
  var d = DOMAINES.filter(function (x) { return x.cle === cle; })[0];
  var objet = encodeURIComponent('ARGOS · ' + codeSite(s) + ' · ' + s.commune + ', ' + s.rue + ' · ' + d.titre);
  var html = d.cle === 'notaire'
    ? '<strong>' + NOTAIRE.nom + '</strong>' + NOTAIRE.role + '<br><a href="mailto:' + NOTAIRE.courriel + '?subject=' + objet + '">Écrire au sujet de ce site</a>'
    : '<strong>' + d.avocat + '</strong>' + AVOCATS[s.region].bureau + '<br><a href="#" data-avocat>Écrire au sujet de ce site</a>';
  document.getElementById('carteContact').innerHTML = '<div class="carte-contact">' + html + '<div class="code-site">Référence du site : ' + codeSite(s) + '</div></div>';
}
document.getElementById('fiche').addEventListener('click', function (e) {
  var n = e.target.closest('[data-nav]');
  if (n && !n.disabled) {
    var i = visibles.findIndex(function (x) { return x.id === courant; }) + (+n.getAttribute('data-nav'));
    if (visibles[i]) choisir(visibles[i].id, true);
    return;
  }
  var tb = e.target.closest('[data-bloc]');
  if (tb) {
    var cle = tb.getAttribute('data-bloc');
    etatBlocs[cle] = !etatBlocs[cle];
    tb.setAttribute('aria-expanded', String(etatBlocs[cle]));
    tb.nextElementSibling.hidden = !etatBlocs[cle];
    return;
  }
  if (e.target.closest('[data-doc]')) { annoncer('Maquette : aucun document réel. Le téléchargement sécurisé viendra avec la version définitive.'); return; }
  var b = e.target.closest('#btnAssist');
  if (b) { var o = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', String(o)); document.getElementById('onglets').classList.toggle('ouvert', o); if (!o) document.getElementById('carteContact').innerHTML = ''; return; }
  var t = e.target.closest('[data-domaine]');
  if (t) { document.querySelectorAll('[data-domaine]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === t)); }); montrerContact(SITES[courant], t.getAttribute('data-domaine')); return; }
  if (e.target.closest('[data-avocat]')) { e.preventDefault(); annoncer('Maquette : les coordonnées de l’avocat seront chargées dans l’administration.'); }
});

/* ---------- Sélection d’un site ---------- */
function choisir(id, centrer) {
  courant = id;
  var s = SITES[id];
  ouverts[s.region] = true; ouverts[cleCom(s)] = true; ouverts['C|' + s.commune] = true;
  formes.carte.forEach(function (f, k) { f.setStyle(k === id ? STYLE_ACTIF : STYLE_NORMAL); });
  if (centrer) carte.flyTo([s.lat, s.lng], 17, { duration: 0.8 });
  construireListe();
  afficherFiche(s);
  var b = elListe.querySelector('.rue[data-id="' + id + '"]');
  if (b) b.scrollIntoView({ block: 'nearest' });
  if (document.body.classList.contains('visite')) afficherBandeauVisite();
}

/* ---------- Plein écran de la carte (comme REDPAR) ---------- */
var zone = document.getElementById('zoneCarte');
document.getElementById('btnPlein').addEventListener('click', function () {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (zone.requestFullscreen) zone.requestFullscreen();
  else annoncer('Ce navigateur ne permet pas le plein écran.');
});
document.addEventListener('fullscreenchange', function () {
  document.getElementById('txtPlein').textContent = document.fullscreenElement ? 'Quitter le plein écran' : 'Plein écran';
  setTimeout(function () { carte.invalidateSize(); }, 150);
});

/* ---------- Mode visite ---------- */
var selVisite = document.getElementById('visiteCommune');
selVisite.innerHTML = '<option value="">Toutes les communes</option>' + communes.map(function (c) { return '<option>' + c + '</option>'; }).join('');
var parcours = [], rang = 0;

function preparerParcours() {
  var c = selVisite.value;
  parcours = SITES.filter(function (s) { return !c || s.commune === c; })
    .sort(function (a, b) { return a.commune.localeCompare(b.commune, 'fr') || a.rue.localeCompare(b.rue, 'fr'); });
  rang = 0;
  allerVisite();
}
function allerVisite() {
  if (!parcours.length) return;
  var s = parcours[rang];
  courant = s.id;
  formes.carte.forEach(function (f, k) { f.setStyle(k === s.id ? STYLE_ACTIF : STYLE_NORMAL); });
  carte.flyTo([s.lat, s.lng], 18, { duration: 1.1 });
  afficherBandeauVisite();
}
function afficherBandeauVisite() {
  var s = SITES[courant];
  document.getElementById('bandeauVisite').innerHTML =
    '<span class="rang">' + (rang + 1) + ' sur ' + parcours.length + '</span>' +
    '<div><h2>' + s.commune + '</h2><p>' + s.rue + ' · ' + s.nature + (s.surface ? ' · ' + s.surface : '') + '</p></div>' +
    '<div class="liens"><span>Titre</span><span>Plan</span><span>Bail</span><span>Diagnostics</span><span>Taxe foncière</span></div>';
}
function entrerVisite() {
  document.body.classList.add('visite');
  if (courant !== null) selVisite.value = SITES[courant].commune;
  setTimeout(function () { carte.invalidateSize(); preparerParcours(); }, 60);
}
function quitterVisite() {
  document.body.classList.remove('visite');
  setTimeout(function () { carte.invalidateSize(); aerienne.invalidateSize(); cadastre.invalidateSize(); choisir(courant, false); }, 60);
}
document.getElementById('btnVisite').addEventListener('click', function () {
  document.body.classList.contains('visite') ? quitterVisite() : entrerVisite();
});
document.getElementById('quitterVisite').addEventListener('click', quitterVisite);
selVisite.addEventListener('change', preparerParcours);
document.getElementById('visitePrec').addEventListener('click', function () { rang = (rang - 1 + parcours.length) % parcours.length; allerVisite(); });
document.getElementById('visiteSuiv').addEventListener('click', function () { rang = (rang + 1) % parcours.length; allerVisite(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { fermerContact(); if (document.body.classList.contains('visite')) quitterVisite(); }
  if (!document.body.classList.contains('visite') || /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') document.getElementById('visiteSuiv').click();
  if (e.key === 'ArrowLeft') document.getElementById('visitePrec').click();
});

/* ---------- Fenêtre de contact ---------- */

/* ---------- Message bref ---------- */

/* ---------- Ouverture : descente de drone sur la vue aérienne, parcelles allumées, balises sur les sites, puis le nom (une fois par session) ---------- */
(function () {
  var intro = document.getElementById('intro');
  var dejaVue = false;
  try { dejaVue = sessionStorage.getItem('argos-intro') === '1'; sessionStorage.setItem('argos-intro', '1'); } catch (e) {}
  var calme = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (dejaVue || calme) { intro.remove(); return; }
  var fini = false, minuteurs = [];
  function plus(f, ms) { minuteurs.push(setTimeout(f, ms)); }
  function finir() {
    if (fini) return; fini = true;
    minuteurs.forEach(clearTimeout);
    intro.classList.add('part');
    setTimeout(function () { intro.remove(); }, 950);
  }
  document.getElementById('passerIntro').addEventListener('click', finir);
  function titreSeul() { intro.classList.add('titre'); plus(finir, 2600); }
  if (!window.maplibregl) { titreSeul(); return; }

  /* Deux sites d'une même ville pour le survol */
  var survol = SITES.filter(function (s) { return s.commune === 'Paris'; }).slice(0, 2);
  if (survol.length < 2) survol = SITES.slice(0, 2);
  var cLng = (survol[0].lng + survol[1].lng) / 2, cLat = (survol[0].lat + survol[1].lat) / 2;
  var carte3d;
  try {
    carte3d = new maplibregl.Map({
      container: 'introCarte', interactive: false, attributionControl: false, fadeDuration: 0, pixelRatio: Math.max(2, window.devicePixelRatio || 1), maxTileCacheSize: 600,
      center: [2.3080, 48.8715], zoom: 15.3, pitch: 0, bearing: -25, maxPitch: 40,
      style: { version: 8, sources: { ortho: { type: 'raster', tileSize: 128, maxzoom: 19,
        tiles: ['https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}'] } },
        layers: [{ id: 'fond', type: 'background', paint: { 'background-color': '#0F2238' } }, { id: 'ortho', type: 'raster', source: 'ortho', paint: { 'raster-fade-duration': 250, 'raster-contrast': 0.12, 'raster-saturation': 0.1 } }] }
    });
  } catch (e) { titreSeul(); return; }

  var parti = false;
  plus(function () { if (!parti) { titreSeul(); } }, 5000); /* fonds trop lents : on passe au titre */
  /* Contours réels des parcelles du client, lus au cadastre (ou contour de secours) */
  function parcellesClient() {
    return { type: 'FeatureCollection', features: survol.map(function (s) {
      var ll = formes.carte[s.id].getLatLngs();
      while (Array.isArray(ll[0]) && Array.isArray(ll[0][0])) ll = ll[0];
      if (Array.isArray(ll[0])) ll = ll[0];
      var anneau = ll.map(function (p) { return [p.lng, p.lat]; });
      anneau.push(anneau[0]);
      return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [anneau] } };
    }) };
  }
  /* Pour l'ouverture : d'autres immeubles du client (carmin) et des zones signalées (alertes), autour des deux sites */
  var AUTRES = [[48.8722, 2.3088], [48.8746, 2.3058], [48.8716, 2.3030]];
  var ALERTES = [[48.8741, 2.3102], [48.8708, 2.3070], [48.8752, 2.3135]];
  function lirePoints(pts) {
    return Promise.all(pts.map(function (pt, k) {
      return attendre(120 * k).then(function () { return window.fetch ? demanderParcelle(pt[1], pt[0]) : null; }).catch(function () { return null; });
    })).then(function (fs) { return { type: 'FeatureCollection', features: fs.filter(Boolean).map(function (f) { return { type: 'Feature', properties: {}, geometry: f.geometry }; }) }; });
  }
  var autresPret = lirePoints(AUTRES), alertesPret = lirePoints(ALERTES);
  function signalerAlertes() {
    alertesPret.then(function (g) {
      if (fini) return;
      carte3d.addSource('alertes', { type: 'geojson', data: g });
      carte3d.addLayer({ id: 'alerte-fond', type: 'fill', source: 'alertes', paint: { 'fill-color': '#FF982D', 'fill-opacity': 0.3 } });
      carte3d.addLayer({ id: 'alerte-trait', type: 'line', source: 'alertes', paint: { 'line-color': '#FF982D', 'line-width': 2.5, 'line-dasharray': [2, 1.5] } });
      ALERTES.forEach(function (pt, i) {
        var el = document.createElement('div');
        el.className = 'alerte';
        el.innerHTML = '<svg viewBox="0 0 34 34"><path d="M17 3 L32 30 H2 Z" fill="#FF982D" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><rect x="15.5" y="12" width="3" height="10" rx="1.5" fill="#0F2238"/><circle cx="17" cy="25.5" r="1.8" fill="#0F2238"/></svg>';
        new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([pt[1], pt[0]]).addTo(carte3d);
        plus(function () { el.classList.add('pose'); }, 250 + i * 420);
      });
    });
  }
  function allumerParcelles() {
    carte3d.addSource('client', { type: 'geojson', data: parcellesClient() });
    autresPret.then(function (g) { if (!fini && g.features.length) carte3d.getSource('client').setData({ type: 'FeatureCollection', features: parcellesClient().features.concat(g.features) }); });
    carte3d.addLayer({ id: 'client-halo', type: 'line', source: 'client', paint: { 'line-color': '#FF2E6A', 'line-width': 14, 'line-blur': 10, 'line-opacity': 0 } });
    carte3d.addLayer({ id: 'client-fond', type: 'fill', source: 'client', paint: { 'fill-color': '#A01040', 'fill-opacity': 0 } });
    carte3d.addLayer({ id: 'client-trait', type: 'line', source: 'client', paint: { 'line-color': '#FFFFFF', 'line-width': 2, 'line-opacity': 0 } });
    var debut = performance.now();
    (function pas(t) {
      if (fini) return;
      var k = Math.min(1, (t - debut) / 1600);
      var pulse = 0.75 + 0.25 * Math.sin((t - debut) / 380);
      carte3d.setPaintProperty('client-halo', 'line-opacity', 0.9 * k * pulse);
      carte3d.setPaintProperty('client-fond', 'fill-opacity', 0.38 * k);
      carte3d.setPaintProperty('client-trait', 'line-opacity', k);
      requestAnimationFrame(pas);
    })(debut);
  }

  /* Mosaïque de toutes les parcelles du quartier, lue au cadastre, pour la phase « instable » */
  var mosaiquePrete = !window.fetch ? Promise.resolve(null) : fetch('https://apicarto.ign.fr/api/cadastre/parcelle?_limit=1000&geom=' + encodeURIComponent(JSON.stringify({
      type: 'Polygon', coordinates: [[[cLng - 0.0042, cLat - 0.0028], [cLng + 0.0042, cLat - 0.0028], [cLng + 0.0042, cLat + 0.0028], [cLng - 0.0042, cLat + 0.0028], [cLng - 0.0042, cLat - 0.0028]]] })))
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (g) { return { type: 'FeatureCollection', features: (g.features || []).map(function (f, i) { return { type: 'Feature', id: i + 1, properties: {}, geometry: f.geometry }; }) }; })
    .catch(function () { return null; });
  var PALETTE = ['#6DD5DC', '#FF982D', '#33838B', '#FFE764', '#E64A4A', '#9B7BE0', '#A01040'];
  function boite(geom) {
    var c = geom.coordinates; while (Array.isArray(c[0][0])) c = c[0];
    var x0 = 180, y0 = 90, x1 = -180, y1 = -90;
    c.forEach(function (p) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    return [x0, y0, x1, y1];
  }
  var chaos = null;
  function lancerChaos(g) {
    if (!g || !g.features.length || fini) return;
    var n = g.features.length;
    carte3d.addSource('mosaique', { type: 'geojson', data: g });
    carte3d.addLayer({ id: 'mosaique-fond', type: 'fill', source: 'mosaique', paint: {
      'fill-color': ['coalesce', ['feature-state', 'c'], '#FFFFFF'], 'fill-opacity': ['coalesce', ['feature-state', 'o'], 0],
      'fill-opacity-transition': { duration: 450 }, 'fill-color-transition': { duration: 450 } } });
    carte3d.addLayer({ id: 'mosaique-trait', type: 'line', source: 'mosaique', paint: {
      'line-color': '#FFFFFF', 'line-width': 1, 'line-opacity': ['coalesce', ['feature-state', 'l'], 0.25], 'line-opacity-transition': { duration: 300 } } });
    carte3d.addSource('coupes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    carte3d.addLayer({ id: 'coupes', type: 'line', source: 'coupes', paint: { 'line-color': '#6DD5DC', 'line-width': 2.2, 'line-dasharray': [2, 1.2], 'line-opacity': 0.95 } });
    var debut = performance.now(), pas = 0;
    chaos = setInterval(function () {
      if (fini) { clearInterval(chaos); return; }
      pas++;
      var intensite = Math.min(1, (performance.now() - debut) / 2500);
      var k = Math.round(6 + 26 * intensite);
      for (var i = 0; i < k; i++) {
        var id = 1 + Math.floor(Math.random() * n);
        if (Math.random() < 0.3) carte3d.setFeatureState({ source: 'mosaique', id: id }, { o: 0, l: 0.25 });
        else carte3d.setFeatureState({ source: 'mosaique', id: id }, { c: PALETTE[Math.floor(Math.random() * PALETTE.length)], o: 0.25 + Math.random() * 0.5, l: 0.9 });
      }
      /* redécoupages : des traits de coupe qui traversent des parcelles puis disparaissent */
      if (pas % 2 === 0) {
        var coupes = [];
        for (var j = 0; j < 3 + Math.round(5 * intensite); j++) {
          var b = boite(g.features[Math.floor(Math.random() * n)].geometry), a = Math.random();
          coupes.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: a < 0.5
            ? [[b[0], b[1] + (b[3] - b[1]) * Math.random()], [b[2], b[1] + (b[3] - b[1]) * Math.random()]]
            : [[b[0] + (b[2] - b[0]) * Math.random(), b[1]], [b[0] + (b[2] - b[0]) * Math.random(), b[3]]] } });
        }
        carte3d.getSource('coupes').setData({ type: 'FeatureCollection', features: coupes });
      }
    }, 170);
  }
  function stabiliser() {
    if (chaos) clearInterval(chaos);
    if (!carte3d.getSource('mosaique')) return;
    carte3d.removeFeatureState({ source: 'mosaique' });
    carte3d.getSource('coupes').setData({ type: 'FeatureCollection', features: [] });
    carte3d.setPaintProperty('mosaique-trait', 'line-opacity', 0.18);
  }

  carte3d.on('load', function () {
    if (parti || fini) return; parti = true;
    /* Phase instable : le quartier se colore, se redécoupe, change sans cesse ; puis ARGOS met de l'ordre */
    mosaiquePrete.then(lancerChaos);
    carte3d.easeTo({ center: [cLng, cLat - 0.0004], zoom: 17.3, pitch: 16, bearing: 15, duration: 8500,
      easing: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; } });
    plus(stabiliser, 6300);
    plus(allumerParcelles, 6700);
    plus(signalerAlertes, 7700);
    survol.forEach(function (s, i) {
      var el = document.createElement('div');
      el.className = 'balise';
      el.innerHTML = '<div class="faisceau"></div><div class="pied-b"></div>' +
        '<div class="carte-b"><b>' + s.commune + '</b><span>' + s.rue + '</span><span>' + s.nature + (s.surface && s.surface !== '—' ? ' · ' + s.surface : '') + '</span><i></i></div>';
      new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([s.lng, s.lat]).addTo(carte3d);
      plus(function () { el.classList.add('pose'); }, 8300 + i * 800);
    });
    plus(function () { carte3d.easeTo({ bearing: 28, zoom: 17.5, duration: 4500, easing: function (t) { return t; } }); }, 8500);
    plus(function () { intro.classList.add('titre'); }, 9800);
    plus(finir, 13400);
  });
})();

/* ---------- Vraies parcelles : contour lu au cadastre (API Carto IGN, gratuite) ---------- */
/* Si le point tombe sur la voirie (non cadastrée), on cherche la parcelle la plus proche en spirale (~25 à 60 m) */
var DECALAGES = [[0, 0], [0.00022, 0], [-0.00022, 0], [0, 0.0003], [0, -0.0003], [0.00022, 0.0003], [-0.00022, -0.0003], [0.00022, -0.0003], [-0.00022, 0.0003],
  [0.00045, 0], [-0.00045, 0], [0, 0.0006], [0, -0.0006]];
function demanderParcelle(lng, lat) {
  var geom = encodeURIComponent(JSON.stringify({ type: 'Point', coordinates: [lng, lat] }));
  return fetch('https://apicarto.ign.fr/api/cadastre/parcelle?geom=' + geom)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (g) { return (g.features && g.features[0]) || null; });
}
function lireParcelle(s) {
  if (!window.fetch) return Promise.resolve();
  var i = 0;
  function essai() {
    if (i >= DECALAGES.length) return Promise.reject(new Error('aucune parcelle'));
    var d = DECALAGES[i++];
    return demanderParcelle(s.lng + d[1], s.lat + d[0]).then(function (f) { return f || essai(); });
  }
  return essai()
    .then(function (f) {
      var pr = f.properties || {};
      s.parcelles = [(pr.section || '') + ' ' + String(pr.numero || '').replace(/^0+/, '')];
      if (pr.contenance) s.surface = Number(pr.contenance).toLocaleString('fr-FR') + ' m²';
      var anneaux = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
      var ll = anneaux.map(function (poly) { return poly.map(function (an) { return an.map(function (c) { return [c[1], c[0]]; }); }); });
      formes.carte[s.id].setLatLngs(ll);
      formes.aerienne[s.id].setLatLngs(ll);
      formes.cadastre[s.id].setLatLngs(ll);
      var c = formes.carte[s.id].getBounds().getCenter();
      s.lat = c.lat; s.lng = c.lng;
    })
    .catch(function () { if (!s.parcelles) { s.parcelles = ['non lue']; s.surface = '—'; } })
    .then(function () { if (courant === s.id) afficherFiche(s); return lireZonage(s); });
}
function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function lireZonage(s, essai) {
  if (!window.fetch) return Promise.resolve();
  essai = essai || 1;
  var geom = encodeURIComponent(JSON.stringify({ type: 'Point', coordinates: [s.lng, s.lat] }));
  return fetch('https://apicarto.ign.fr/api/gpu/zone-urba?geom=' + geom)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (g) {
      var f = g.features && g.features[0];
      if (!f) { s.zonage = 'aucun document en ligne'; return; }
      var p = f.properties || {};
      s.zonage = (p.libelle || p.typezone || '?') + (p.libelong ? ' · ' + (p.libelong.length > 60 ? p.libelong.slice(0, 58) + '…' : p.libelong) : '');
    })
    .catch(function () {
      /* le service limite le nombre d'appels : on retente deux fois, en espaçant */
      if (essai < 3) return attendre(1200 * essai).then(function () { return lireZonage(s, essai + 1); });
      s.zonage = 'non lu';
    })
    .then(function () { if (courant === s.id) afficherFiche(s); });
}

/* ---------- Démarrage ---------- */
construireListe();
carte.fitBounds(L.latLngBounds(SITES.map(function (s) { return [s.lat, s.lng]; })).pad(0.15));
synchroniser();
choisir(visibles[0].id, false);
/* Lecture des sites l'un après l'autre (le service public limite les appels simultanés), le site affiché en premier */
(function () {
  var file = SITES.slice().sort(function (a, b) { return (b.id === courant) - (a.id === courant); });
  file.reduce(function (p, s) { return p.then(function () { return lireParcelle(s); }).then(function () { return attendre(150); }); }, Promise.resolve());
})();
</script>
